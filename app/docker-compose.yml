services:
  postgres:
    container_name: ${COMPOSE_PROJECT_NAME}-postgres
    image: postgres:15-alpine
    restart: unless-stopped
    networks:
      - internal
    volumes:
      - ${SETEX_DATA_DIR}/postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: setex_db
      POSTGRES_USER: setex_user
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U setex_user -d setex_db && psql -U setex_user -d setex_db -c 'SELECT 1' > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '${CPU_LIMIT_DB}'
          memory: ${MEM_LIMIT_DB}

  backend:
    container_name: ${COMPOSE_PROJECT_NAME}-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - internal
    volumes:
      - ${SETEX_DATA_DIR}/uploads:/app/uploads
      - ${SETEX_LOGS_DIR}/backend:/app/logs
      - ${SETEX_BASE_DIR}/app/backend/src/config/features.json:/app/src/config/features.json
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      UPLOAD_RATE_LIMIT: ${UPLOAD_RATE_LIMIT:-30}
    secrets:
      - jwt_secret
      - postgres_password
      - openai_api_key
      - azure_di_key
      - azure_di_endpoint
      - mistral_api_key
      - smtp_user
      - smtp_pass
      - redis_password
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '${CPU_LIMIT_BACKEND}'
          memory: ${MEM_LIMIT_BACKEND}

  redis:
    container_name: ${COMPOSE_PROJECT_NAME}-redis
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server /etc/redis/redis.conf
    volumes:
      - ${SETEX_DATA_DIR}/redis:/data
      - ${SETEX_SECRETS_DIR}/redis.conf:/etc/redis/redis.conf:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$(grep -m1 requirepass /etc/redis/redis.conf | awk '{print $2}')\" ping | grep -q PONG"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '${CPU_LIMIT_REDIS}'
          memory: ${MEM_LIMIT_REDIS}

  frontend:
    container_name: ${COMPOSE_PROJECT_NAME}-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - internal
      - traefik_default
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_default"
      # HTTP → HTTPS redirect
      - "traefik.http.routers.${SETEX_ROUTER}-http.rule=Host(`${SETEX_DOMAIN}`)"
      - "traefik.http.routers.${SETEX_ROUTER}-http.entrypoints=web"
      - "traefik.http.routers.${SETEX_ROUTER}-http.middlewares=${SETEX_ROUTER}-redirect"
      # HTTPS — router principal (con BasicAuth si SETEX_HTTPS_MIDDLEWARES lo
      # indica). Usa priority 10 para que el router -api de abajo gane cuando
      # la ruta es /api/*.
      - "traefik.http.routers.${SETEX_ROUTER}.rule=Host(`${SETEX_DOMAIN}`)"
      - "traefik.http.routers.${SETEX_ROUTER}.entrypoints=websecure"
      - "traefik.http.routers.${SETEX_ROUTER}.tls=true"
      - "traefik.http.routers.${SETEX_ROUTER}.tls.certresolver=mytlschallenge"
      - "traefik.http.routers.${SETEX_ROUTER}.middlewares=${SETEX_HTTPS_MIDDLEWARES:-}"
      - "traefik.http.routers.${SETEX_ROUTER}.priority=10"
      # HTTPS — router para /api/* SIN BasicAuth. El backend ya autentica con
      # JWT (Authorization: Bearer) + rate limits. Poner BasicAuth aquí chocaría
      # con el header Authorization del cliente, dejando la API inutilizable.
      # Priority 100 garantiza que este router matchea antes que el principal.
      - "traefik.http.routers.${SETEX_ROUTER}-api.rule=Host(`${SETEX_DOMAIN}`) && PathPrefix(`/api/`)"
      - "traefik.http.routers.${SETEX_ROUTER}-api.entrypoints=websecure"
      - "traefik.http.routers.${SETEX_ROUTER}-api.tls=true"
      - "traefik.http.routers.${SETEX_ROUTER}-api.tls.certresolver=mytlschallenge"
      - "traefik.http.routers.${SETEX_ROUTER}-api.priority=100"
      - "traefik.http.routers.${SETEX_ROUTER}-api.service=${SETEX_ROUTER}"
      # Middlewares
      - "traefik.http.middlewares.${SETEX_ROUTER}-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.${SETEX_ROUTER}-redirect.redirectscheme.permanent=true"
      - "traefik.http.middlewares.${SETEX_ROUTER}-auth.basicauth.users=${SETEX_BASICAUTH_USERS:-noop:noop}"
      # Middleware IP allowlist (opt-in). Solo actúa si se lo incluye en
      # SETEX_HTTPS_MIDDLEWARES, por ejemplo:
      #   SETEX_HTTPS_MIDDLEWARES=setex-stg-auth,setex-stg-ipallow
      # sourceRange puede ser uno o varios CIDR separados por coma.
      # Default 0.0.0.0/0 = permite todo (inocuo si nadie añade el middleware).
      - "traefik.http.middlewares.${SETEX_ROUTER}-ipallow.ipallowlist.sourcerange=${SETEX_ALLOWED_IPS:-0.0.0.0/0}"
      # Service
      - "traefik.http.services.${SETEX_ROUTER}.loadbalancer.server.port=80"
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '${CPU_LIMIT_FRONTEND}'
          memory: ${MEM_LIMIT_FRONTEND}

networks:
  traefik_default:
    external: true
  internal:
    driver: bridge

secrets:
  postgres_password:
    file: ${SETEX_SECRETS_DIR}/postgres_password.txt
  jwt_secret:
    file: ${SETEX_SECRETS_DIR}/jwt_secret.txt
  openai_api_key:
    file: ${SETEX_SECRETS_DIR}/openai_api_key.txt
  azure_di_key:
    file: ${SETEX_SECRETS_DIR}/azure_di_key.txt
  azure_di_endpoint:
    file: ${SETEX_SECRETS_DIR}/azure_di_endpoint.txt
  mistral_api_key:
    file: ${SETEX_SECRETS_DIR}/mistral_api_key.txt
  smtp_user:
    file: ${SETEX_SECRETS_DIR}/smtp_user.txt
  smtp_pass:
    file: ${SETEX_SECRETS_DIR}/smtp_pass.txt
  redis_password:
    file: ${SETEX_SECRETS_DIR}/redis_password.txt
