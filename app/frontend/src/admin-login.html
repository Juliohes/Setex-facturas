<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>SETEX — Acceso Administración</title>
  <link rel="icon" href="favicon-admin.svg" type="image/svg+xml">
  <link rel="stylesheet" href="admin-facturas.css?v=20260810-001">
</head>
<body>

  <!-- Login dedicado del panel de administración (2026-07-05).
       Esta página NO está protegida por el auth_request de nginx (a diferencia
       de /admin-facturas.html): es la puerta de entrada. Tras login correcto
       de un admin, POST /api/admin/refresh-session emite la cookie httpOnly
       setex_admin y se redirige al panel, donde nginx ya valida la cookie. -->
  <div id="login-screen" style="display:flex;">
    <div class="login-card">
      <div class="login-logo"><span class="se">SE</span><span class="tex">TEX</span></div>
      <h1 class="login-title">Panel de Administración</h1>
      <p class="login-subtitle">Acceso exclusivo para administradores</p>
      <form id="login-form" autocomplete="on">
        <div class="login-field">
          <label for="login-email">Correo electrónico</label>
          <input type="email" id="login-email" name="email" placeholder="tu@email.com" required autocomplete="email">
        </div>
        <div class="login-field">
          <label for="login-password">Contraseña</label>
          <input type="password" id="login-password" name="password" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <p id="login-error" class="login-error" style="display:none;"></p>
        <button type="submit" id="login-btn" class="login-btn">Entrar</button>
      </form>
      <p class="login-subtitle" style="margin-top:16px;">
        <a href="/" style="color:inherit;">← Volver al portal de usuarios</a>
      </p>
    </div>
  </div>

  <script src="auth.js?v=20260810-001"></script>
  <script src="admin-login.js?v=20260705-001"></script>
</body>
</html>
