worker_processes auto;
error_log /tmp/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 10M;
    gzip on;
    gzip_types text/css application/javascript application/json;

    # ── Seguridad: rate limiting y límite de conexiones (equivalente htaccess) ──
    # Zona de rate limiting: 10 req/s por IP (burst 20 con delay)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    # Zona de conexiones simultáneas: máx 50 por IP
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
    # Devolver JSON en lugar de HTML en los errores de rate limit
    limit_req_status 429;
    limit_conn_status 429;

    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;

        # ── Security Headers ──────────────────────────────────────────
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self' https://setex-facturas.es; frame-ancestors 'none'; form-action 'self';" always;

        # Ocultar version de nginx
        server_tokens off;

        # ── PWA: Service Worker — sin caché HTTP, scope raíz ────────────
        location = /service-worker.js {
            auth_request /api/internal/check-access;
            # Defensa en profundidad: nginx auth_request sólo acepta 200/401/403; cualquier
            # otro código del subrequest interno (429 del auto-block, 500 por excepción,
            # 503 fail-secure DB, 502/504 por timeout hacia el backend) degradaría a "500
            # Internal Server Error" opaco. Mapeamos todos esos códigos a la página 404
            # neutra para que un fallo transitorio del backend nunca rompa la UX del sitio.
            error_page 401 403 404 429 500 502 503 504 =404 @bloqueado;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            add_header Pragma "no-cache";
            add_header Expires "0";
            add_header Service-Worker-Allowed "/";
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self' https://setex-facturas.es; frame-ancestors 'none'; form-action 'self';" always;
            try_files $uri =404;
        }

        # ── PWA: Manifest — caché 1h (no es crítico actualizarlo rápido) ─
        location = /manifest.json {
            add_header Cache-Control "public, max-age=3600";
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }

        # ── PWA: Iconos — caché 24h (sin immutable para poder actualizar)
        location /icons/ {
            add_header Cache-Control "public, max-age=86400";
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }

        # ── Panel admin: protección con cookie httpOnly ──────────────────
        # /admin-facturas.html solo se sirve si nginx verifica la cookie 'setex_admin'.
        # Sin cookie válida → redirect a /?next=admin (login principal).
        # Este location ESPECÍFICO tiene precedencia sobre el bloque regex ~* \.html$ de abajo.
        location = /admin-facturas.html {
            auth_request /api/internal/check-admin-page;
            error_page 401 403 = @admin_login_redirect;
            # Si el subrequest devuelve algo inesperado (429/500/503/etc) tratamos la
            # página admin como "no disponible" en vez de propagar 500.
            error_page 404 429 500 502 503 504 =404 @bloqueado;

            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            add_header Pragma "no-cache";
            add_header Expires "0";
            add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://setex-facturas.es; frame-ancestors 'none'; form-action 'self';" always;
            try_files $uri =404;
        }

        # Redirect cuando no hay sesión admin válida
        location @admin_login_redirect {
            return 302 /?next=admin;
        }

        # Subrequest interna para validar cookie admin (pasa Cookie al backend)
        location = /api/internal/check-admin-page {
            internal;
            proxy_pass http://backend:3000;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Cookie $http_cookie;
        }

        # Deshabilitar cache para archivos dinámicos (JS, CSS, HTML)
        location ~* \.(html|js|css)$ {
            # Comprobar horario antes de servir ficheros estáticos
            auth_request /api/internal/check-access;
            # Defensa en profundidad: nginx auth_request sólo acepta 200/401/403; cualquier
            # otro código del subrequest interno (429 del auto-block, 500 por excepción,
            # 503 fail-secure DB, 502/504 por timeout hacia el backend) degradaría a "500
            # Internal Server Error" opaco. Mapeamos todos esos códigos a la página 404
            # neutra para que un fallo transitorio del backend nunca rompa la UX del sitio.
            error_page 401 403 404 429 500 502 503 504 =404 @bloqueado;

            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            add_header Pragma "no-cache";
            add_header Expires "0";
            # Security headers (deben repetirse en cada location con add_header)
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self' https://setex-facturas.es; frame-ancestors 'none'; form-action 'self';" always;
            try_files $uri =404;
        }

        # ── Subrequest interno para control de acceso horario ────────────
        # nginx llama a este endpoint antes de servir cualquier recurso.
        # Si el backend responde 404 → horario bloqueado → la petición
        # principal también devuelve 404.
        location = /api/internal/check-access {
            internal;
            proxy_pass http://backend:3000;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Original-URI $request_uri;
        }

        location /api/ {
            # Comprobar horario antes de procesar la petición
            auth_request /api/internal/check-access;
            # Defensa en profundidad: nginx auth_request sólo acepta 200/401/403; cualquier
            # otro código del subrequest interno (429 del auto-block, 500 por excepción,
            # 503 fail-secure DB, 502/504 por timeout hacia el backend) degradaría a "500
            # Internal Server Error" opaco. Mapeamos todos esos códigos a la página 404
            # neutra para que un fallo transitorio del backend nunca rompa la UX del sitio.
            error_page 401 403 404 429 500 502 503 504 =404 @bloqueado;

            # Rate limiting: 10 req/s burst 20 (nodelay = no encolamiento, falla rápido)
            limit_req zone=api_limit burst=20 nodelay;
            # Máx 50 conexiones simultáneas por IP
            limit_conn conn_limit 50;

            proxy_pass http://backend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            # Comprobar horario antes de servir ficheros estáticos
            auth_request /api/internal/check-access;
            # Defensa en profundidad: nginx auth_request sólo acepta 200/401/403; cualquier
            # otro código del subrequest interno (429 del auto-block, 500 por excepción,
            # 503 fail-secure DB, 502/504 por timeout hacia el backend) degradaría a "500
            # Internal Server Error" opaco. Mapeamos todos esos códigos a la página 404
            # neutra para que un fallo transitorio del backend nunca rompa la UX del sitio.
            error_page 401 403 404 429 500 502 503 504 =404 @bloqueado;
            try_files $uri $uri/ /index.html;
        }

        # Página de bloqueo: HTML mínimo sin marca de servidor.
        # return 404 "" no funciona (nginx ignora el string vacío y sirve su página por defecto).
        # Con default_type + body explícito nginx no añade su footer.
        location @bloqueado {
            default_type text/html;
            return 404 "<!DOCTYPE html><html><head><title>404 Not Found</title></head><body><h1>Not Found</h1><p>The requested URL was not found on this server.</p></body></html>";
        }

        location /health {
            return 200 "healthy\n";
        }
    }
}
